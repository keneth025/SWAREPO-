<button class="close-btn" (click)="dialogRef.close(false)">
  <span class="material-icons">close</span>
</button>

<!-- #region Dialog Header -->
<section class="dialog-header">
  <div class="dialog-title">
    Upload Registration
  </div>
  <div class="dialog-sub-title">
    Upload registration sheet to register all employees to selected course/s
  </div>
</section>
<!-- #endregion -->

<!-- #region Dialog Body -->
<section class="dialog-body">
  <div class="upload-form" [formGroup]="UploadForm">
    <div class="header">Registration Sheet</div>

    <div class="picker-form">
      <div class="note">Use the <a [href]="templateLink" target="_blank">template</a> and upload the file below.</div>
      <div class="filepicker-container"
        *ngIf="UploadForm.get('TemplateFile') as UploadFile"
        [ngClass]="{ 'invalid': UploadFile.invalid }"
      >
        <div id="file-label">
          {{ UploadFile.value ? UploadFile.value.name : '' }}
        </div>
        <button id="browse-btn"
          (click)="fileButton.click()"
        > Browse </button>
        <input
          #fileButton
          hidden
          type="file"
          (change)="onFileChange($event)"
        />
      </div>
    </div>

    <div class="onecap-input-form"
      [ngClass]="{ 'invalid': UploadForm.get('CourseIds').invalid }"
    >
      <label> Course Name<span class="required">*</span> </label>
      <div class="select-container">
        <mat-select
          [panelClass]="'onecaplite-option-container'"
          [disableOptionCentering]="true"
          [placeholder]="'-'"
          formControlName="CourseIds"
          multiple
        >
          <div class="search-filter flex flex-row align-items-center">
            <span class="material-icons">search</span>
            <input
              (keydown)="$event.stopPropagation()"
              [formControl]="CourseSearchFilter"
              type="text"
              placeholder="Enter key words"
            >
          </div>
          <mat-option
            *ngFor="let item of (FilteredCourseList | async)"
            [value]="item.Id"
          >{{ item.Title }}</mat-option>
        </mat-select>
      </div>
    </div>
  </div>
</section>
<!-- #endregion -->

<!-- #region Dialog Footer -->
<section id="attendance-form" class="dialog-action">
  <button class="onecap-btn accent-2"
    [disabled]="!UploadForm.valid"
    (click)="submit()"
  >Submit</button>
</section>
<!-- #endregion Dialog Footer -->
