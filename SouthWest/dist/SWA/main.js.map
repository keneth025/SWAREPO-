<div class="progress-bar-container" *ngIf="!isVertical">
  <div class="percentage-acquired" [ngStyle]="{width:(acquiredPercentage) + '%'}"></div>
</div>
<div class="progress-bar-container" *ngIf="isVertical">
  <div class="percentage-acquired-vertical" [ngStyle]="{height:(acquiredPercentage) + '%'}"></div>
</div>
