<div class="page-container">
  <section class="page-header">
    <div class="page-title"> Roles </div>
  </section>

  <section class="page-body" *ngIf="!pageIsLoading">

    <!-- Filters -->
    <section id="filters" class="card">
      <!-- Search -->
      <div class="onecap-input-form">
        <label>Role Name</label>
        <div class="input-container">
          <input type="text"
            placeholder="Search"
            [formControl]="keywordFilter"
          />
        </div>
      </div>

      <!-- Category -->
      <div class="onecap-input-form">
        <label>Category</label>
        <div class="select-container">
          <mat-select
            placeholder="All Category"
            [panelClass]="'onecaplite-option-container'"
            [formControl]="selectedRoleCategory"
          >
            <mat-option [value]="-1"> All </mat-option>
            <mat-option *ngFor="let item of (roleCategoryList | async)"
              [value]="item.Id"
            > {{ item.Title }} </mat-option>
          </mat-select>
        </div>
      </div>

      <!-- Sub-Category -->
      <div class="onecap-input-form">
        <label>Sub-Category</label>
        <div class="select-container">
          <mat-select
            placeholder="All Sub-Category"
            [panelClass]="'onecaplite-option-container'"
            [formControl]="selectedRoleSubCategory"
          >
            <mat-option [value]="-1"> All </mat-option>
            <mat-option *ngFor="let item of (filteredRoleSubCategoryList | async)"
              [value]="item.Id"
            > {{ item.Title }} </mat-option>
          </mat-select>
        </div>
      </div>

      <!-- Course Owner -->
      <div class="onecap-input-form">
        <label>Role Owner</label>
        <div class="select-container">
          <mat-select
            placeholder="All Category"
            [panelClass]="'onecaplite-option-container'"
            [formControl]="ownerFilter"
          >
            <mat-option [value]="1"> @Me </mat-option>
            <mat-option [value]="-1"> All </mat-option>
          </mat-select>
        </div>
      </div>
    </section>

    <section id="actions">
      <!-- Add Employee Button -->
      <button class="onecap-btn accent-2"
        (click)="create()"
      >
        <div class="button-wrapper">
          <span class="material-icons">add</span>
          Create Role
        </div>
      </button>
    </section>

    <section id="data" class="card">
      <ng-container *ngIf="filteredRoleList|async as list">
          <div class="table-container" >
            <div id="role-table" class="onecap-table" *ngIf="list.length > 0 && !dataIsLoading">

              <div class="table-header">

                <div id="details" class="section" >
                  <div class="col-name">
                    Role Name
                  </div>
                  <div class="col-name">
                    Last Modified
                  </div>
                </div>

                <div id="action" class="section">
                  <div class="col-name">Action</div>
                </div>

              </div>

              <div class="table-row" *ngFor="let item of list">

                <div id="details" class="section" >
                  <div class="col-name">
                    <div class="onecap-link-btn accent-2" (click)="update(item)">
                      {{ item.Title }}
                    </div>
                  </div>
                  <div class="col-name">
                    {{item.DateModified}} {{item.Editor.Title}}
                  </div>
                </div>

                <div id="action" class="section">
                  <div class="col-name action-col">
                    <button class="onecap-icon-btn accent"
                      [disabled]="!item.IsOwner"
                      (click)="update(item)"
                      matTooltip="Edit"
                      matTooltipPosition="above"
                    >
                      <span class="material-icons">edit</span>
                    </button>
                    <button class="onecap-icon-btn error"
                      [disabled]="!item.IsOwner"
                      (click)="delete(item)"
                      matTooltip="Delete"
                      matTooltipPosition="above"
                    >
                      <span class="material-icons">clear</span>
                    </button>
                  </div>
                </div>

              </div>

            </div>

            <div class="card-message" *ngIf="list.length === 0 && !dataIsLoading">
              No role available.
            </div>

            <div class="status-loading" *ngIf="dataIsLoading">
              <app-loader></app-loader>
            </div>
          </div>
      </ng-container>

    </section>

  </section>

  <section class="page-loader" *ngIf="pageIsLoading">
    <app-loader></app-loader>
  </section>

</div>
